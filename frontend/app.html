<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Collective AI</title>
<link rel="icon" href="images/Logo-favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #09090b;
  --panel:   #111113;
  --card:    #16161a;
  --border:  rgba(255,255,255,0.07);
  --bhi:     rgba(255,255,255,0.11);
  --primary: #6366f1;
  --pdark:   #4f46e5;
  --accent:  #a78bfa;
  --text:    #f1f1f3;
  --sub:     #a1a1aa;
  --muted:   #52525b;
  --danger:  #ef4444;
}

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Sora', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-y: auto;
}

/* ── BACKGROUND ── */
.bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
}

/* Subtle grid */
.bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
}

/* Glow orbs */
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.18;
  animation: drift 12s ease-in-out infinite alternate;
}
.orb1 {
  width: 600px; height: 600px;
  background: var(--primary);
  top: -200px; left: -150px;
  animation-delay: 0s;
}
.orb2 {
  width: 500px; height: 500px;
  background: var(--accent);
  bottom: -180px; right: -100px;
  animation-delay: -6s;
}
.orb3 {
  width: 300px; height: 300px;
  background: #06b6d4;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0.07;
  animation-delay: -3s;
}
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(30px, 20px) scale(1.05); }
}
.orb3 { animation: drift3 14s ease-in-out infinite alternate; }
@keyframes drift3 {
  from { transform: translate(-50%, -50%) scale(1); }
  to   { transform: translate(calc(-50% + 20px), calc(-50% + 15px)) scale(1.08); }
}

/* ── LAYOUT ── */
.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* ── CARD ── */
.card {
  width: 100%;
  max-width: 440px;
  background: rgba(17, 17, 19, 0.85);
  border: 1px solid var(--bhi);
  border-radius: 20px;
  padding: 40px 36px;
  backdrop-filter: blur(24px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04),
    0 24px 64px rgba(0,0,0,.6),
    0 0 80px rgba(99,102,241,.06);
  animation: cardIn .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(18px) scale(.98); }
  to   { opacity: 1; transform: none; }
}

/* ── LOGO ── */
.logo-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 32px;
}
.logo-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 20px rgba(99,102,241,.4);
}
.logo-name {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -.02em;
}

/* ── HEADING ── */
.heading {
  text-align: center;
  margin-bottom: 28px;
}
.heading h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -.03em;
  margin-bottom: 6px;
}
.heading p {
  font-size: .84rem;
  color: var(--sub);
  line-height: 1.6;
}

/* ── TAB BAR ── */
.tabs {
  display: flex;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 24px;
  gap: 2px;
}
.tab {
  flex: 1;
  padding: 8px;
  border-radius: 7px;
  font-size: .82rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  color: var(--muted);
  transition: color .15s, background .15s;
  border: none;
  background: none;
  font-family: inherit;
}
.tab.active {
  background: var(--card);
  color: var(--text);
  box-shadow: 0 1px 4px rgba(0,0,0,.4);
}

/* ── PANELS ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── AUTH BUTTONS ROW ── */
.auth-row {
  margin-bottom: 20px;
}

/* Google button */
.btn-google {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 11px 14px;
  background: var(--panel);
  border: 1px solid var(--bhi);
  border-radius: 10px;
  font-size: .84rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
  font-family: inherit;
}
.btn-google:hover {
  background: var(--card);
  border-color: rgba(255,255,255,.18);
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
  transform: translateY(-1px);
}
.btn-google:active { transform: translateY(0); }

/* GitHub button removed */

/* ── DIVIDER ── */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.divider span {
  font-size: .72rem;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: .06em;
  text-transform: uppercase;
}

/* ── FORM ── */
.form { display: flex; flex-direction: column; gap: 12px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label {
  font-size: .75rem;
  font-weight: 600;
  color: var(--sub);
  letter-spacing: .03em;
}
.field input {
  padding: 11px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: .84rem;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus {
  border-color: rgba(99,102,241,.5);
  box-shadow: 0 0 0 3px rgba(99,102,241,.1);
}
.field input::placeholder { color: var(--muted); }

/* Password wrapper */
.pw-wrap { position: relative; }
.pw-wrap input { width: 100%; padding-right: 42px; }
.pw-toggle {
  position: absolute;
  right: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  transition: color .15s;
  background: none;
  border: none;
  padding: 2px;
}
.pw-toggle:hover { color: var(--sub); }

/* Forgot */
.forgot {
  display: flex;
  justify-content: flex-end;
  margin-top: -4px;
}
.forgot a {
  font-size: .75rem;
  color: var(--accent);
  text-decoration: none;
  cursor: pointer;
  transition: color .15s;
}
.forgot a:hover { color: var(--primary); }

/* ── SUBMIT BUTTON ── */
.btn-submit {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Sora', sans-serif;
  font-size: .86rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .01em;
  margin-top: 4px;
  transition: background .15s, box-shadow .15s, transform .1s;
  box-shadow: 0 0 0 0 rgba(99,102,241,0);
  position: relative;
  overflow: hidden;
}
.btn-submit::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.08) 0%, transparent 60%);
  pointer-events: none;
}
.btn-submit:hover {
  background: var(--pdark);
  box-shadow: 0 0 24px rgba(99,102,241,.45);
  transform: translateY(-1px);
}
.btn-submit:active { transform: translateY(0); }
.btn-submit:disabled {
  opacity: .5;
  cursor: default;
  transform: none;
  box-shadow: none;
}

/* Spinner inside button */
.btn-submit .spin {
  display: none;
  width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn-submit.loading .btn-text { display: none; }
.btn-submit.loading .spin    { display: block; }

/* ── ERROR ── */
.err {
  display: none;
  padding: 10px 13px;
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.25);
  border-radius: 8px;
  font-size: .78rem;
  color: #fca5a5;
  line-height: 1.5;
}
.err.show { display: block; }

/* ── SWITCH LINK ── */
.switch {
  text-align: center;
  margin-top: 20px;
  font-size: .78rem;
  color: var(--muted);
}
.switch a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  cursor: pointer;
  transition: color .15s;
}
.switch a:hover { color: var(--primary); }

/* ── FOOTER ── */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: .71rem;
  color: var(--muted);
  line-height: 1.6;
}
.footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.footer a:hover { color: var(--sub); }

/* ── BACK LINK ── */
.back-link {
  position: fixed;
  top: 20px; left: 24px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: .78rem;
  font-weight: 500;
  color: var(--muted);
  text-decoration: none;
  z-index: 10;
  transition: color .15s;
}
.back-link:hover { color: var(--sub); }

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .card { padding: 30px 22px; }
}
</style>
</head>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, onAuthStateChanged,
         signInWithPopup, GoogleAuthProvider,
         signInWithEmailAndPassword,
         createUserWithEmailAndPassword,
         updateProfile,
         sendPasswordResetEmail }                 from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const app  = initializeApp({
  apiKey:            "AIzaSyDSo6zYkmgSndJG9Oq9rMBQFIAIDl51vyU",
  authDomain:        "collective-ai-auth.firebaseapp.com",
  projectId:         "collective-ai-auth",
  storageBucket:     "collective-ai-auth.firebasestorage.app",
  messagingSenderId: "851370153534",
  appId:             "1:851370153534:web:484314623047fd110ca36f"
});
const auth  = getAuth(app);
const gProv = new GoogleAuthProvider();

// Already signed in → redirect
onAuthStateChanged(auth, user => {
  if (user) location.href = 'dashboard.html';
});

// ── Helpers ──
function showErr(msg) {
  const el = document.getElementById('err');
  el.style.background = '';
  el.style.borderColor = '';
  el.style.color = '';
  el.textContent = msg;
  el.classList.add('show');
}
function clearErr() {
  document.getElementById('err').classList.remove('show');
}
function setLoading(btnId, on) {
  const btn = document.getElementById(btnId);
  btn.classList.toggle('loading', on);
  btn.disabled = on;
}
function fbErr(code) {
  const map = {
    'auth/user-not-found':       'No account found with that email.',
    'auth/wrong-password':       'Incorrect password.',
    'auth/invalid-credential':   'Incorrect email or password.',
    'auth/invalid-email':        'Please enter a valid email address.',
    'auth/email-already-in-use': 'An account with this email already exists.',
    'auth/weak-password':        'Password must be at least 6 characters.',
    'auth/popup-closed-by-user': 'Sign-in popup was closed.',
  };
  return map[code] || 'Something went wrong. Please try again.';
}

// ── Google OAuth ──
async function oauthSignIn() {
  clearErr();
  try {
    await signInWithPopup(auth, gProv);
    location.href = 'dashboard.html';
  } catch (e) {
    showErr(fbErr(e.code));
  }
}
document.getElementById('btn-google-in').onclick = oauthSignIn;
document.getElementById('btn-google-up').onclick = oauthSignIn;

// ── Email Sign In ──
window.handleEmailSignIn = async function() {
  clearErr();
  const email = document.getElementById('in-email').value.trim();
  const pw    = document.getElementById('in-pw').value;
  if (!email || !pw) { showErr('Please enter your email and password.'); return; }
  setLoading('btn-submit-in', true);
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    location.href = 'dashboard.html';
  } catch (e) {
    showErr(fbErr(e.code));
    setLoading('btn-submit-in', false);
  }
};

// ── Email Sign Up ──
window.handleEmailSignUp = async function() {
  clearErr();
  const name  = document.getElementById('up-name').value.trim();
  const email = document.getElementById('up-email').value.trim();
  const pw    = document.getElementById('up-pw').value;
  if (!name)        { showErr('Please enter your name.'); return; }
  if (!email)       { showErr('Please enter your email.'); return; }
  if (pw.length < 6){ showErr('Password must be at least 6 characters.'); return; }
  setLoading('btn-submit-up', true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await updateProfile(cred.user, { displayName: name });
    location.href = 'dashboard.html';
  } catch (e) {
    showErr(fbErr(e.code));
    setLoading('btn-submit-up', false);
  }
};

// ── Forgot password ──
window.handleForgot = async function() {
  clearErr();
  const email = document.getElementById('in-email').value.trim();
  if (!email) { showErr('Enter your email address above first.'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    const el = document.getElementById('err');
    el.style.background   = 'rgba(99,102,241,.1)';
    el.style.borderColor  = 'rgba(99,102,241,.25)';
    el.style.color        = '#a78bfa';
    el.textContent        = 'Reset email sent — check your inbox.';
    el.classList.add('show');
  } catch (e) {
    showErr(fbErr(e.code));
  }
};

// ── Enter key submits ──
document.getElementById('in-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.handleEmailSignIn();
});
document.getElementById('up-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.handleEmailSignUp();
});
</script>

services:
  - type: web
    name: collective-ai-backend
    runtime: python
    pythonVersion: "3.11.4"
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.server:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 180 --keep-alive 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: PYTHONUNBUFFERED
        value: true
      - key: ALLOWED_ORIGIN
        value: *
      - key: ALLOWED_ORIGIN_REGEX
        value: ^https://([a-z0-9-]+\.)*vercel\.app$
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false
      - key: WARMUP_LLM_ON_STARTUP
        value: false
      - key: WARMUP_RAG_ON_STARTUP
        value: false
      - key: ENABLE_RAG
        value: false
      - key: WARMUP_LLM_TIMEOUT_SECONDS
        value: 45
      - key: CHAT_TIMEOUT_SECONDS
        value: 75
      - key: RAG_TIMEOUT_SECONDS
        value: 15
      - key: MAX_ACTIVE_SESSIONS
        value: 250
      - key: MAX_HISTORY_TURNS
        value: 20
      - key: REQUEST_TIMEOUT
        value: 60
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: collective-ai-rag
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
      - key: VECTOR_DIMENSION
        value: 384
    autoDeploy: true
    healthCheckPath: /api/ready

services:
  - type: web
    name: collective-ai-backend
    runtime: python
    pythonVersion: "3.11"
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # server.py is inside backend/, so module path is just "server:app"
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: ALLOWED_ORIGIN
        value: https://collective-ai.vercel.app   # update to your Vercel URL
    healthCheckPath: /
    autoDeploy: true
